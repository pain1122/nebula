Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
LocalSocket /run/medical-scan/clamd.sock
# Only scanner/check/worker containers mount this volume; no network listener.
LocalSocketMode 666
FixStaleSocket yes
TemporaryDirectory /tmp
LogFile /tmp/clamd.log
LogFileMaxSize 1M
LogTime yes
LogClean no
LogVerbose no
FailIfCvdOlderThan 2
MaxThreads 1
MaxQueue 2
MaxConnectionQueueLength 2
ConcurrentDatabaseReload no
SelfCheck 300
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 25M
MaxRecursion 10
MaxFiles 100
MaxScanTime 40000
ReadTimeout 50
CommandReadTimeout 5
SendBufTimeout 5000
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
ScanPDF yes
ScanArchive yes
ScanImage yes
DisableCache yes
EnableShutdownCommand no
EnableReloadCommand yes
EnableStatsCommand no
